<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Maverick Data Hub Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Arial;
background:#f5f5f5;
text-align:center;
padding:40px;
}

.box{
background:white;
padding:25px;
border-radius:10px;
max-width:350px;
margin:auto;
box-shadow:0 0 10px #ccc;
}

input,button{
width:90%;
padding:12px;
margin:10px;
border-radius:8px;
}

button{
background:#0066ff;
color:white;
border:none;
}
</style>

</head>

<body>

<div class="box">

<h2>🔥 Maverick Data Hub 🔥</h2>

<h3>Admin Login</h3>

<input id="password" type="password" placeholder="Enter password">

<button onclick="login()">🔐 Login</button>

<p id="msg"></p>

</div>


<script>

function login(){

let password=document.getElementById("password").value;

if(password=="Maverick123"){

localStorage.setItem("admin","true");

window.location="admin.html";

}else{

document.getElementById("msg").innerHTML="Wrong password ❌";

}

}

</script>

</body>
</html>
